<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 340" width="1120" height="340" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" fill="#1b1b1f">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2b2b33"/></marker></defs>
<rect width="1120" height="340" rx="14" fill="#ffffff"/>
<rect x="20" y="110" width="160" height="110" rx="10" fill="#e9eef9" stroke="#2b2b33" stroke-width="1.5"/><text x="100.0" y="136" text-anchor="middle" font-weight="700" font-size="15">Text so far</text><text x="100.0" y="160" text-anchor="middle" font-size="13" fill="#3b3b45">“London is famous</text><text x="100.0" y="178" text-anchor="middle" font-size="13" fill="#3b3b45">for ____”</text><text x="100.0" y="196" text-anchor="middle" font-size="13" fill="#3b3b45">tail: “famous for”</text>
<rect x="250" y="40" width="210" height="120" rx="10" fill="#f4f1ea" stroke="#2b2b33" stroke-width="1.5"/><text x="355.0" y="66" text-anchor="middle" font-weight="700" font-size="15">Level 1 · which block?</text><text x="355.0" y="90" text-anchor="middle" font-size="13" fill="#3b3b45">255 themed blocks,</text><text x="355.0" y="108" text-anchor="middle" font-size="13" fill="#3b3b45">each described by theme</text><text x="355.0" y="126" text-anchor="middle" font-size="13" fill="#3b3b45">and example words</text><text x="355.0" y="144" text-anchor="middle" font-size="13" fill="#3b3b45">→ open the top 30</text>
<rect x="250" y="195" width="210" height="100" rx="10" fill="#f4f1ea" stroke="#2b2b33" stroke-width="1.5"/><text x="355.0" y="221" text-anchor="middle" font-weight="700" font-size="15">Side question</text><text x="355.0" y="245" text-anchor="middle" font-size="13" fill="#3b3b45">What is the last</text><text x="355.0" y="263" text-anchor="middle" font-size="13" fill="#3b3b45">character of the tail?</text><text x="355.0" y="281" text-anchor="middle" font-size="13" fill="#3b3b45">letter / mark / nothing</text>
<rect x="560" y="40" width="230" height="120" rx="10" fill="#f4f1ea" stroke="#2b2b33" stroke-width="1.5"/><text x="675.0" y="66" text-anchor="middle" font-weight="700" font-size="15">Level 2 · which words?</text><text x="675.0" y="90" text-anchor="middle" font-size="13" fill="#3b3b45">255 words per opened block,</text><text x="675.0" y="108" text-anchor="middle" font-size="13" fill="#3b3b45">asked in parallel batches</text><text x="675.0" y="126" text-anchor="middle" font-size="13" fill="#3b3b45">→ shortlist per block, sized</text><text x="675.0" y="144" text-anchor="middle" font-size="13" fill="#3b3b45">by its level-1 probability</text>
<rect x="870" y="40" width="230" height="120" rx="10" fill="#f4f1ea" stroke="#2b2b33" stroke-width="1.5"/><text x="985.0" y="66" text-anchor="middle" font-weight="700" font-size="15">Level 3 · which one?</text><text x="985.0" y="90" text-anchor="middle" font-size="13" fill="#3b3b45">the 255 shortlisted words,</text><text x="985.0" y="108" text-anchor="middle" font-size="13" fill="#3b3b45">each shown in place:</text><text x="985.0" y="126" text-anchor="middle" font-size="13" fill="#3b3b45">“famous for its”, “famous for.”</text><text x="985.0" y="144" text-anchor="middle" font-size="13" fill="#3b3b45">→ a probability distribution</text>
<rect x="870" y="195" width="230" height="100" rx="10" fill="#e9eef9" stroke="#2b2b33" stroke-width="1.5"/><text x="985.0" y="221" text-anchor="middle" font-weight="700" font-size="15">Suggestion</text><text x="985.0" y="245" text-anchor="middle" font-size="13" fill="#3b3b45">temperature 0: the top word;</text><text x="985.0" y="263" text-anchor="middle" font-size="13" fill="#3b3b45">otherwise sampled from the</text><text x="985.0" y="281" text-anchor="middle" font-size="13" fill="#3b3b45">90% nucleus. Tab accepts.</text>
<line x1="180" y1="150" x2="250" y2="105" stroke="#2b2b33" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="180" y1="180" x2="250" y2="240" stroke="#2b2b33" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="460" y1="100" x2="560" y2="100" stroke="#2b2b33" stroke-width="1.5" marker-end="url(#a)"/><text x="510.0" y="92" text-anchor="middle" font-size="12" fill="#3b3b45">top 30 blocks</text>
<line x1="790" y1="100" x2="870" y2="100" stroke="#2b2b33" stroke-width="1.5" marker-end="url(#a)"/><text x="830.0" y="92" text-anchor="middle" font-size="12" fill="#3b3b45">255 candidates</text>
<line x1="985" y1="160" x2="985" y2="195" stroke="#2b2b33" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="460" y1="245" x2="675" y2="245" stroke="#2b2b33" stroke-width="1.5" marker-end="url(#a)"/><text x="472" y="263" text-anchor="start" font-size="12" fill="#3b3b45">marks shortlisted only after a letter or digit</text>
<line x1="675" y1="245" x2="675" y2="160" stroke="#2b2b33" stroke-width="1.5" marker-end="url(#a)"/>
<text x="20" y="326" font-size="12" fill="#3b3b45">Every box on the top row, and the side question, is a question to Jev. Code only splits the text, sizes the shortlists from Jev’s probabilities, and samples.</text>
</svg>